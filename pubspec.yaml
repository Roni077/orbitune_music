name: orbitune
description: "Orbitune — Modern Online Music Player with Material 3 Expressive UI & multi-source audio streaming."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Material 3 Expressive UI Framework & Icons
  material_3_expressive: ^1.0.8
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.0.0
  google_fonts: ^8.2.1
  palette_generator_plus: ^1.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  marquee: ^2.2.3
  flutter_spinkit: ^5.2.1
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  image_picker: ^1.1.2

  # Audio Playback & Media Session
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4

  # Media Extraction & Streaming
  extractor: ^1.0.0
  youtube_explode_dart: ^3.1.0
  http: ^1.2.2
  dio: ^5.7.0

  # State Management & Local Storage
  flutter_riverpod: ^2.6.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.4
  permission_handler: ^11.4.0
  connectivity_plus: ^7.3.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  just_audio_platform_interface: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
